# Banco H2 exclusivo para testes
spring.datasource.url=jdbc:h2:mem:clubez_test;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS APP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema utilizado pelo JPA
spring.jpa.properties.hibernate.default_schema=APP

# Cria e remove as tabelas durante os testes
spring.jpa.hibernate.ddl-auto=create-drop

# Configuracoes adicionais
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
