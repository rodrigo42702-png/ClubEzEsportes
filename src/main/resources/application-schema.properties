# Banco H2 temporário para gerar o script
spring.datasource.url=jdbc:h2:file:./database/TesteSchema;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS APP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema do projeto
spring.jpa.properties.hibernate.default_schema=APP

# Gera os comandos SQL sem modificar o banco principal
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/schema-gerado.sql
spring.jpa.properties.jakarta.persistence.schema-generation.create-source=metadata
