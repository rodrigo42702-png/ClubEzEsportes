<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | ClubEzEsportes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --azul: #016FB9;
            --laranja: #EFA00B;
            --verde: #72B01D;
            --vermelho: #FF1D15;
            --preto: #02020B;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--preto), #25303b);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border-radius: 18px;
            border: none;
            overflow: hidden;
        }

        .login-header {
            background: var(--preto);
            color: white;
            text-align: center;
            padding: 30px;
            border-bottom: 5px solid var(--laranja);
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-header .ez {
            color: var(--laranja);
        }

        .btn-entrar {
            background: var(--azul);
            color: white;
            border: none;
        }

        .btn-entrar:hover {
            background: #00558f;
            color: white;
        }

        .form-control:focus {
            border-color: var(--azul);
            box-shadow: 0 0 0 .2rem rgba(1, 111, 185, .15);
        }

        .faixa-cores {
            display: flex;
            height: 6px;
        }

        .faixa-cores span {
            flex: 1;
        }
    </style>
</head>

<body>
<div class="container px-3">
    <div class="card login-card shadow-lg mx-auto">

        <div class="login-header">
            <h1>Club<span class="ez">Ez</span>Esportes</h1>
            <p class="mb-0 text-white-50">
                Sistema de Gestão Esportiva
            </p>
        </div>

        <div class="faixa-cores">
            <span style="background: #016FB9"></span>
            <span style="background: #EFA00B"></span>
            <span style="background: #72B01D"></span>
            <span style="background: #FF1D15"></span>
        </div>

        <div class="card-body p-4">

            <h2 class="h4 text-center mb-4">Acesse sua conta</h2>

            <!-- Mensagem de login incorreto -->
            <div th:if="${param.error}"
                 class="alert alert-danger" role="alert">
                E-mail ou senha inválidos.
            </div>

            <!-- Mensagem após logout -->
            <div th:if="${param.logout}"
                 class="alert alert-success" role="alert">
                Você saiu do sistema.
            </div>

            <!-- Spring Security processa POST /login -->
            <form th:action="@{/login}" method="post">

                <!-- Token CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="username" class="form-label">
                        E-mail
                    </label>

                    <input type="email"
                           id="username"
                           name="username"
                           class="form-control"
                           autocomplete="username"
                           required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Senha
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-entrar w-100 py-2 fw-semibold">
                    Entrar
                </button>

            </form>
        </div>

        <div class="card-footer bg-white text-center py-3">
            <small class="text-secondary">
                ClubEzEsportes © 2026
            </small>
        </div>
    </div>
</div>
</body>
</html>
