<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pagamentos | ClubEzEsportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body><div class="ce-layout">
    <div th:replace="~{fragments/sidebar :: menu('pagamentos')}"></div>
    <main class="ce-content">
        <h1 class="ce-title">Pagamentos</h1>
        <p class="ce-subtitle">Registro e acompanhamento de pagamentos associados a matrículas.</p>
        <div th:if="${sucesso}" class="ce-alert ce-alert--success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="ce-alert ce-alert--danger" th:text="${erro}"></div>
        <section sec:authorize="hasRole('ADMIN')" class="ce-panel mb-4">
            <div class="ce-panel__header"><h2 class="ce-panel__title">Registrar pagamento pendente</h2></div>
            <div class="ce-panel__body">
                <form th:action="@{/pagamentos}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4"><label for="matriculaId" class="ce-label">Matrícula</label>
                            <select id="matriculaId" name="matriculaId" class="ce-input" required>
                                <option value="">Selecione...</option>
                                <option th:each="matricula : ${matriculas}" th:value="${matricula.id}" th:text="|Matrícula #${matricula.id}|"></option>
                            </select></div>
                        <div class="col-md-4"><label for="valor" class="ce-label">Valor (R$)</label><input id="valor" name="valor" type="number" step="0.01" min="0" class="ce-input" required></div>
                        <div class="col-md-4"><label for="vencimento" class="ce-label">Vencimento</label><input id="vencimento" name="vencimento" type="date" class="ce-input" required></div>
                    </div>
                    <button type="submit" class="ce-btn ce-btn--primary mt-3">Registrar pagamento</button>
                </form>
            </div>
        </section>
        <section class="ce-panel"><div class="ce-panel__header"><h2 class="ce-panel__title">Pagamentos cadastrados</h2></div>
            <div class="ce-panel__body"><div class="ce-table-wrap"><table class="ce-table">
                <thead><tr><th>ID</th><th>Matrícula</th><th>Valor (R$)</th><th>Vencimento</th><th>Pagamento</th><th>Situação</th><th sec:authorize="hasRole('ADMIN')">Alterar situação</th></tr></thead>
                <tbody>
                <tr th:each="pagamento : ${pagamentos}">
                    <td th:text="${pagamento.id}"></td><td th:text="${pagamento.matriculaId}"></td>
                    <td th:text="${pagamento.valor}"></td><td th:text="${pagamento.vencimento}"></td>
                    <td th:text="${pagamento.dataPagamento != null ? pagamento.dataPagamento : '-'}"></td>
                    <td th:text="${pagamento.status}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <form th:action="@{/pagamentos/{id}/status(id=${pagamento.id})}" method="post" class="d-flex gap-2">
                            <select name="status" class="ce-input" aria-label="Nova situação">
                                <option th:each="situacao : ${situacoes}"
                                        th:value="${situacao}" th:text="${situacao}" th:selected="${situacao == pagamento.status}"></option>
                            </select>
                            <button type="submit" class="ce-btn ce-btn--primary">Salvar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pagamentos)}"><td colspan="7" class="ce-empty">Nenhum pagamento cadastrado.</td></tr>
                </tbody></table></div></div></section>
    </main></div></body></html>
