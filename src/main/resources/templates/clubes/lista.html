
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Clubes | ClubEzEsportes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS personalizado do ClubEzEsportes -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* Destaque laranja do título */
        .titulo-pagina {
            border-left: 5px solid var(--golden-orange);
            padding-left: 15px;
        }
    </style>
</head>

<body>

<!-- Estrutura com menu lateral e conteúdo -->
<div class="ce-layout">

    <!-- Menu lateral compartilhado -->
    <div th:replace="~{fragments/sidebar :: menu('clubes')}"></div>

    <!-- Conteúdo principal -->
    <main class="ce-content">

        <!-- Título -->
        <div class="titulo-pagina mb-4">
            <h1 class="h2 fw-bold">Gerenciamento de Clubes</h1>

            <p class="text-secondary mb-0">
                Consulte e gerencie os clubes cadastrados.
            </p>
        </div>

        <!-- Mensagem de sucesso -->
        <div th:if="${sucesso}"
             class="ce-alert ce-alert--success"
             th:text="${sucesso}">
        </div>

        <!-- Mensagem de erro -->
        <div th:if="${erro}"
             class="ce-alert ce-alert--danger"
             th:text="${erro}">
        </div>

        <!-- Formulário exclusivo para ADMIN -->
        <section sec:authorize="hasRole('ADMIN')"
                 class="ce-panel mb-4">

            <div class="ce-panel__header">
                <h2 class="ce-panel__title">
                    Cadastrar novo clube
                </h2>
            </div>

            <div class="ce-panel__body">

                <!-- Envia os dados para o ClubeWebController -->
                <form th:action="@{/clubes}" method="post">

                    <div class="row g-3">

                        <!-- Nome do clube -->
                        <div class="col-md-5">

                            <label for="nome" class="ce-label">
                                Nome do clube
                            </label>

                            <input type="text"
                                   id="nome"
                                   name="nome"
                                   maxlength="150"
                                   class="ce-input"
                                   required>
                        </div>

                        <!-- Cidade -->
                        <div class="col-md-4">

                            <label for="cidade" class="ce-label">
                                Cidade
                            </label>

                            <input type="text"
                                   id="cidade"
                                   name="cidade"
                                   class="ce-input"
                                   required>
                        </div>

                        <!-- Estado -->
                        <div class="col-md-3">

                            <label for="estado" class="ce-label">
                                Estado (UF)
                            </label>

                            <input type="text"
                                   id="estado"
                                   name="estado"
                                   maxlength="2"
                                   pattern="[A-Za-z]{2}"
                                   placeholder="SP"
                                   class="ce-input"
                                   required>
                        </div>

                    </div>

                    <!-- Botão de cadastro -->
                    <div class="mt-3">
                        <button type="submit"
                                class="ce-btn ce-btn--primary">
                            Cadastrar clube
                        </button>
                    </div>

                </form>

            </div>
        </section>

        <!-- Tabela com os clubes cadastrados -->
        <section class="ce-panel">

            <div class="ce-panel__header">
                <h2 class="ce-panel__title">
                    Clubes cadastrados
                </h2>
            </div>

            <div class="ce-panel__body">

                <div class="ce-table-wrap">

                    <table class="ce-table">

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Cidade</th>
                            <th>Estado</th>
                            <th>Situação</th>
                        </tr>
                        </thead>

                        <tbody>

                        <!-- Exibe os clubes vindos do banco H2 -->
                        <tr th:each="clube : ${clubes}">

                            <td th:text="${clube.id}">1</td>

                            <td th:text="${clube.nome}">
                                Clube Exemplo
                            </td>

                            <td th:text="${clube.cidade}">
                                São Paulo
                            </td>

                            <td th:text="${clube.estado}">
                                SP
                            </td>

                            <td>
                                <!-- Clube ativo -->
                                <span th:if="${clube.ativo}"
                                      class="ce-badge ce-badge--success">
                                    Ativo
                                </span>

                                <!-- Clube inativo -->
                                <span th:unless="${clube.ativo}"
                                      class="ce-badge">
                                    Inativo
                                </span>
                            </td>

                        </tr>

                        <!-- Mensagem caso não existam clubes -->
                        <tr th:if="${#lists.isEmpty(clubes)}">
                            <td colspan="5" class="ce-empty">
                                Nenhum clube cadastrado.
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>
        </section>

    </main>

</div>

</body>
</html>
