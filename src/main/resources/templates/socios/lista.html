<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sócios | ClubEzEsportes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="ce-layout">

    <div th:replace="~{fragments/sidebar :: menu('socios')}"></div>

    <main class="ce-content">

        <h1 class="ce-title">Sócios</h1>
        <p class="ce-subtitle">Cadastro e gerenciamento dos sócios do clube.</p>

        <div th:if="${sucesso}"
             class="ce-alert ce-alert--success"
             th:text="${sucesso}"></div>

        <div th:if="${erro}"
             class="ce-alert ce-alert--danger"
             th:text="${erro}"></div>

        <!-- Cadastro: disponível somente para ADMIN -->
        <section sec:authorize="hasRole('ADMIN')" class="ce-panel mb-4">

            <div class="ce-panel__header">
                <h2 class="ce-panel__title">Novo sócio</h2>
            </div>

            <div class="ce-panel__body">
                <form th:action="@{/socios}" method="post">

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label for="nome" class="ce-label">Nome</label>
                            <input id="nome" name="nome"
                                   class="ce-input" required>
                        </div>

                        <div class="col-md-3">
                            <label for="cpf" class="ce-label">CPF (11 números)</label>
                            <input id="cpf" name="cpf"
                                   class="ce-input"
                                   pattern="[0-9]{11}"
                                   maxlength="11" required>
                        </div>

                        <div class="col-md-3">
                            <label for="email" class="ce-label">E-mail</label>
                            <input id="email" name="email"
                                   type="email" class="ce-input" required>
                        </div>

                        <div class="col-md-2">
                            <label for="nascimento" class="ce-label">Nascimento</label>
                            <input id="nascimento"
                                   name="dataNascimento"
                                   type="date" class="ce-input">
                        </div>
                    </div>

                    <button type="submit"
                            class="ce-btn ce-btn--primary mt-3">
                        Cadastrar sócio
                    </button>

                </form>
            </div>
        </section>

        <!-- Listagem de sócios -->
        <section class="ce-panel">

            <div class="ce-panel__header">
                <h2 class="ce-panel__title">Sócios cadastrados</h2>
            </div>

            <div class="ce-panel__body">
                <div class="ce-table-wrap">

                    <table class="ce-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Nascimento</th>
                            <th>Situação</th>
                            <th sec:authorize="hasRole('ADMIN')">Ações</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="socio : ${socios}">
                            <td th:text="${socio.id}"></td>
                            <td th:text="${socio.nome}"></td>

                            <td th:text="${socio.email != null ? socio.email : '-'}"></td>

                            <td th:text="${socio.dataNascimento != null ? socio.dataNascimento : '-'}"></td>

                            <td>
                                <span th:if="${socio.ativo}"
                                      class="badge bg-success">Ativo</span>

                                <span th:unless="${socio.ativo}"
                                      class="badge bg-secondary">Inativo</span>
                            </td>

                            <td sec:authorize="hasRole('ADMIN')">

                                <!-- Abre o modal de edição -->
                                <button type="button"
                                        class="btn btn-sm btn-outline-primary"
                                        data-bs-toggle="modal"
                                        th:attr="data-bs-target='#editarSocio-' + ${socio.id}">
                                    Editar
                                </button>

                                <!-- Ativa ou desativa o cadastro -->
                                <form th:action="@{/socios/{id}/situacao(id=${socio.id})}"
                                      method="post"
                                      class="d-inline">

                                    <button type="submit"
                                            class="btn btn-sm btn-outline-secondary"
                                            th:text="${socio.ativo ? 'Desativar' : 'Reativar'}"
                                            onclick="return confirm('Deseja alterar a situação deste sócio?');">
                                    </button>

                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(socios)}">
                            <td sec:authorize="hasRole('ADMIN')"
                                colspan="6" class="ce-empty">
                                Nenhum sócio cadastrado.
                            </td>
                            <td sec:authorize="!hasRole('ADMIN')"
                                colspan="5" class="ce-empty">
                                Nenhum sócio cadastrado.
                            </td>
                        </tr>

                        </tbody>
                    </table>

                </div>
            </div>
        </section>

        <!-- Modais de edição: somente ADMIN -->
        <div sec:authorize="hasRole('ADMIN')"
             th:each="socio : ${socios}">

            <div class="modal fade"
                 th:id="'editarSocio-' + ${socio.id}"
                 tabindex="-1"
                 aria-hidden="true">

                <div class="modal-dialog modal-lg">

                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">
                                Editar sócio
                            </h5>

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="modal"
                                    aria-label="Fechar"></button>
                        </div>

                        <form th:action="@{/socios/{id}/editar(id=${socio.id})}"
                              method="post">

                            <div class="modal-body">

                                <div class="row g-3">

                                    <div class="col-md-6">
                                        <label class="form-label">Nome</label>
                                        <input name="nome"
                                               class="form-control"
                                               th:value="${socio.nome}"
                                               required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">CPF</label>
                                        <input name="cpf"
                                               class="form-control"
                                               th:value="${socio.cpf}"
                                               pattern="[0-9]{11}"
                                               maxlength="11"
                                               required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">E-mail</label>
                                        <input name="email"
                                               type="email"
                                               class="form-control"
                                               th:value="${socio.email}"
                                               required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Nascimento</label>
                                        <input name="dataNascimento"
                                               type="date"
                                               class="form-control"
                                               th:value="${socio.dataNascimento}">
                                    </div>

                                </div>

                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Cancelar
                                </button>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Salvar alterações
                                </button>

                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
