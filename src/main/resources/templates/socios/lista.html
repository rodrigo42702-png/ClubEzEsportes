<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sócios | ClubEzEsportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body><div class="ce-layout">
    <div th:replace="~{fragments/sidebar :: menu('socios')}"></div>
    <main class="ce-content">
        <h1 class="ce-title">Sócios</h1>
        <p class="ce-subtitle">Cadastros vinculados ao banco de dados.</p>
        <div th:if="${sucesso}" class="ce-alert ce-alert--success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="ce-alert ce-alert--danger" th:text="${erro}"></div>
        <section sec:authorize="hasRole('ADMIN')" class="ce-panel mb-4">
            <div class="ce-panel__header"><h2 class="ce-panel__title">Novo sócio</h2></div>
            <div class="ce-panel__body">
                <form th:action="@{/socios}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4"><label for="nome" class="ce-label">Nome</label><input id="nome" name="nome" class="ce-input" required></div>
                        <div class="col-md-3"><label for="cpf" class="ce-label">CPF (11 números)</label><input id="cpf" name="cpf" class="ce-input" pattern="[0-9]{11}" maxlength="11" required></div>
                        <div class="col-md-3"><label for="email" class="ce-label">E-mail</label><input id="email" name="email" type="email" class="ce-input" required></div>
                        <div class="col-md-2"><label for="nascimento" class="ce-label">Nascimento</label><input id="nascimento" name="dataNascimento" type="date" class="ce-input"></div>
                    </div>
                    <button type="submit" class="ce-btn ce-btn--primary mt-3">Cadastrar sócio</button>
                </form>
            </div>
        </section>
        <section class="ce-panel"><div class="ce-panel__header"><h2 class="ce-panel__title">Sócios cadastrados</h2></div>
            <div class="ce-panel__body"><div class="ce-table-wrap"><table class="ce-table">
                <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Nascimento</th><th>Situação</th></tr></thead>
                <tbody>
                <tr th:each="socio : ${socios}"><td th:text="${socio.id}"></td><td th:text="${socio.nome}"></td>
                    <td th:text="${socio.email != null ? socio.email : '-'}"></td>
                    <td th:text="${socio.dataNascimento != null ? socio.dataNascimento : '-'}"></td>
                    <td th:text="${socio.ativo ? 'Ativo' : 'Inativo'}"></td></tr>
                <tr th:if="${#lists.isEmpty(socios)}"><td colspan="5" class="ce-empty">Nenhum sócio cadastrado.</td></tr>
                </tbody></table></div></div></section>
    </main></div></body></html>
