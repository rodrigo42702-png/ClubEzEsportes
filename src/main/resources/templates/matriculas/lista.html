
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Matrículas | ClubEzEsportes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS original do projeto -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>

<!-- Estrutura principal -->
<div class="ce-layout">

    <!-- Menu lateral compartilhado -->
    <div th:replace="~{fragments/sidebar :: menu('matriculas')}"></div>

    <!-- Conteúdo principal -->
    <main class="ce-content">

    <!-- Título -->
    <div class="mb-4">
        <p class="ce-eyebrow">Gestão esportiva</p>
        <h1 class="ce-title">Matrículas</h1>
        <p class="ce-subtitle">
            Consulte as matrículas registradas no sistema.
        </p>
    </div>

    <!-- Tabela de matrículas -->
    <section class="ce-panel">

        <div class="ce-panel__header">
            <h2 class="ce-panel__title">
                Matrículas cadastradas
            </h2>
        </div>

        <div class="ce-panel__body">

            <div class="ce-table-wrap">
                <table class="ce-table">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código legado</th>
                        <th>Clube ID</th>
                        <th>Sócio ID</th>
                        <th>Plano ID</th>
                        <th>Início</th>
                        <th>Fim</th>
                        <th>Valor contratado</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- Dados enviados pelo MatriculaWebController -->
                    <tr th:each="matricula : ${matriculas}">

                        <td th:text="${matricula.id}">1</td>

                        <td th:text="${matricula.codigoLegado != null ? matricula.codigoLegado : '-'}">
                            -
                        </td>

                        <td th:text="${matricula.clubeId}">1</td>

                        <td th:text="${matricula.socioId}">1</td>

                        <td th:text="${matricula.planoId}">1</td>

                        <td th:text="${matricula.dataInicio}">2026-01-01</td>

                        <td th:text="${matricula.dataFim != null ? matricula.dataFim : '-'}">
                            -
                        </td>

                        <td th:text="${matricula.valorContratado != null ? matricula.valorContratado : '-'}">
                            -
                        </td>

                        <td>
                            <span class="ce-badge"
                                  th:classappend="${matricula.status.name() == 'ATIVA' ? 'ce-badge--success' :
                                                   matricula.status.name() == 'INADIMPLENTE' ? 'ce-badge--warning' :
                                                   matricula.status.name() == 'CANCELADA' ? 'ce-badge--danger' : ''}"
                                  th:text="${matricula.status}">
                                ATIVA
                            </span>
                        </td>

                    </tr>

                    <!-- Caso não existam matrículas -->
                    <tr th:if="${#lists.isEmpty(matriculas)}">
                        <td colspan="9" class="ce-empty">
                            Nenhuma matrícula cadastrada.
                        </td>
                    </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </section>

    </main>

</div>

</body>
</html>
